<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" role="img" aria-label="Конвейер обработки: загрузка, analyze с авто-подбором числа цветов, постановка задачи в Redis, воркер (объект и лица, суперпиксели, слияние, сглаживание, векторизация), результат — палитра, SVG и предпросмотр.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B26"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C8CE0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C8CE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pGlowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8998D" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E8998D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="330" rx="24" fill="url(#pbg)"/>
  <ellipse cx="620" cy="240" rx="520" ry="230" fill="url(#pGlow)"/>
  <ellipse cx="180" cy="60" rx="360" ry="200" fill="url(#pGlowWarm)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- Synchronous front half -->
    <rect x="48" y="60" width="176" height="86" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="136" y="97" font-size="22" fill="#F2F4F8" text-anchor="middle">загрузка</text>
    <text x="136" y="124" font-size="18" fill="#8B95A8" text-anchor="middle">фото</text>

    <rect x="264" y="60" width="176" height="86" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="352" y="97" font-size="22" fill="#F2F4F8" text-anchor="middle">analyze</text>
    <text x="352" y="124" font-size="18" fill="#8B95A8" text-anchor="middle">авто-подбор k</text>

    <rect x="480" y="60" width="176" height="86" rx="16" fill="#F5C97A" fill-opacity="0.14" stroke="#F5C97A" stroke-opacity="0.42"/>
    <text x="568" y="97" font-size="22" fill="#F7E3BC" text-anchor="middle">очередь</text>
    <text x="568" y="124" font-size="18" fill="#C4A97B" text-anchor="middle">Redis · ARQ</text>

    <!-- Result -->
    <rect x="976" y="60" width="176" height="86" rx="16" fill="#9FD3C7" fill-opacity="0.14" stroke="#9FD3C7" stroke-opacity="0.42"/>
    <text x="1064" y="97" font-size="22" fill="#DCF1EB" text-anchor="middle">результат</text>
    <text x="1064" y="124" font-size="18" fill="#8FBDB2" text-anchor="middle">палитра · вектор</text>

    <!-- Worker: where the heavy, asynchronous work happens -->
    <rect x="700" y="34" width="232" height="138" rx="18" fill="#7C8CE0" fill-opacity="0.13" stroke="#7C8CE0" stroke-opacity="0.45"/>
    <text x="816" y="66" font-size="22" fill="#DDE3FA" text-anchor="middle">worker</text>
    <g font-size="18" fill="#AEB8DC" text-anchor="middle">
      <text x="816" y="94">объект и лица</text>
      <text x="816" y="118">суперпиксели · слияние</text>
      <text x="816" y="142">сглаживание · вектор</text>
    </g>

    <!-- Flow -->
    <g stroke="#8B95A8" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M224,103 L256,103"/><path d="M248,97 L257,103 L248,109"/>
      <path d="M440,103 L472,103"/><path d="M464,97 L473,103 L464,109"/>
      <path d="M656,103 L692,103"/><path d="M684,97 L693,103 L684,109"/>
      <path d="M932,103 L968,103"/><path d="M960,97 L969,103 L960,109"/>
    </g>

    <!-- Progress feedback loop: what makes the UI show stages live -->
    <g stroke="#F5C97A" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linecap="round">
      <path d="M816,172 L816,206 L568,206 L568,150"/>
    </g>
    <path d="M562,158 L568,149 L574,158" fill="none" stroke="#F5C97A" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <text x="692" y="230" font-size="18" fill="#C4A97B" text-anchor="middle">прогресс по стадиям</text>

    <!-- The canonical-output note, the thing that makes print quality work -->
    <rect x="48" y="248" width="1104" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="72" y="280" font-size="19" fill="#98A2B4">Канонический выход — вектор: PDF, PNG и экранный контур растеризуются из одного SVG.</text>
  </g>
</svg>
