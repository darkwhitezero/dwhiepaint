services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dwhiepaint
      POSTGRES_USER: dwhiepaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhiepaint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwhiepaint -d dwhiepaint"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cv-service:
    build: ./cv-service
    image: dwhiepaint-cv:latest
    environment:
      CACHE_TTL_SECONDS: 1800
      CACHE_DIR: /data/cache
      REDIS_URL: "redis://redis:6379"
    volumes:
      - cvcache:/data/cache
    expose:
      - "8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Same image as cv-service, different entrypoint: pulls segmentation jobs off
  # Redis and runs the heavy pipeline. Shares the cache volume so the artifacts
  # it renders are served by cv-service's /cache mount.
  worker:
    # Reuse the exact image cv-service builds (same code, different entrypoint) —
    # a separate build: would produce a second, independently-stale image.
    image: dwhiepaint-cv:latest
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      CACHE_DIR: /data/cache
      REDIS_URL: "redis://redis:6379"
    volumes:
      - cvcache:/data/cache
    depends_on:
      redis:
        condition: service_healthy
      cv-service:
        condition: service_started

  backend-api:
    build: ./backend-api
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dwhiepaint;Username=dwhiepaint;Password=${POSTGRES_PASSWORD:-dwhiepaint}"
      CvService__BaseUrl: "http://cv-service:8001"
      Cors__Origin: "http://localhost:5173"
      Jwt__Secret: ${JWT_SECRET:-dev-insecure-secret-change-me-in-production-0123456789}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_started
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:5000"
    depends_on:
      - backend-api
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
  cvcache:
