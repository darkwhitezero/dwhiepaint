services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dwhiepaint
      POSTGRES_USER: dwhiepaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwhiepaint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwhiepaint -d dwhiepaint"]
      interval: 5s
      timeout: 5s
      retries: 10

  cv-service:
    build: ./cv-service
    environment:
      CACHE_TTL_SECONDS: 1800
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-api:
    build: ./backend-api
    environment:
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=dwhiepaint;Username=dwhiepaint;Password=${POSTGRES_PASSWORD:-dwhiepaint}"
      CvService__BaseUrl: "http://cv-service:8001"
      Cors__Origin: "http://localhost:5173"
      Jwt__Secret: ${JWT_SECRET:-dev-insecure-secret-change-me-in-production-0123456789}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_started
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: "http://localhost:5000"
    depends_on:
      - backend-api
    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads:
