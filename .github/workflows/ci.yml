name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push on the same branch/PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  cv-service:
    name: cv-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-service
    steps:
      - uses: actions/checkout@v4
      # cairosvg (via cairocffi) needs the system Cairo library at runtime.
      - name: Install system Cairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            cv-service/requirements.txt
            cv-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  backend:
    name: backend-api (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # No packages.lock.json in the repo, so cache NuGet by csproj hash instead
      # of setup-dotnet's lock-file-based cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend-api/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore backend-api/DwhiePaint.slnx
      - run: dotnet build backend-api/DwhiePaint.slnx -c Release --no-restore
